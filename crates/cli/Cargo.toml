[package]
name = "pathtag-cli"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "pathtag"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rexiv2 = "0.10.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
walkdir = "2.5.0"
